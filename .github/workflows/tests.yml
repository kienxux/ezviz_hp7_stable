name: Tests
on: {push: {paths: ["custom_components/**", "tests/**"]}, pull_request: {paths: ["custom_components/**", "tests/**"]}}
jobs: {pytest: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: "3.12"}}, {run: python -m pip install pytest}, {run: python -m pytest -q tests}]}}
